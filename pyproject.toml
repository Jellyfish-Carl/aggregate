[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate-mpc-demo"
version = "0.5.0"
description = "Three-layer stochastic MPC visual demo for a Chinese retail electricity company"
requires-python = ">=3.9"
dependencies = ["scipy>=1.11,<1.14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpc-demo = "mpc_demo.__main__:main"

[tool.setuptools]
packages = ["mpc_demo"]
